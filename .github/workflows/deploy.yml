name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace domain placeholder
        if: vars.DEPLOY_DOMAIN != ''
        run: |
          echo "Replacing example.com with ${{ vars.DEPLOY_DOMAIN }}"
          sed -i "s|example\.com|${{ vars.DEPLOY_DOMAIN }}|g" install-cc-connect.sh index.html readme.html

      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy files to server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp install-cc-connect.sh provider-presets.json index.html readme.html deploy:${DEPLOY_PATH}/
          ssh deploy "ls -la ${DEPLOY_PATH}"

      - name: Smoke test
        if: vars.DEPLOY_DOMAIN != ''
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          curl -fsSL "https://${DEPLOY_DOMAIN}/install-cc-connect.sh" | head -5
